[package]
name = "invoicevault"
version = "0.1.0"
description = "Local-first invoice processing desktop app"
authors = ["InvoiceVault Contributors"]
edition = "2021"

[lib]
name = "invoicevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "invoicevault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4"
hex = "0.4.3"
imap = "3.0.0-alpha.15"
mailparse = "0.15"
md-5 = "0.10.6"
mime_guess = "2.0.5"
native-tls = "0.2"
reqwest = { version = "0.12.25", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rust_xlsxwriter = "0.81"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.0", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-shell = "2.3.5"
tokio = { version = "1", features = ["sync", "time", "rt"] }
notify = { version = "8", features = ["macos_kqueue"] }
thiserror = "2.0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1.41"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "ndarray", "copy-dylibs", "tls-rustls"] }
ndarray = { version = "0.17", features = ["std"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", features = ["tokio", "rustls-tls"] }
dirs = "6"
printpdf = { version = "0.9", default-features = false, features = ["images", "jpeg", "png", "text_layout"] }

# On macOS/Windows, use load-dynamic (runtime ONNX Runtime loading via ORT_DYLIB_PATH).
# On Linux, the base ort dep is used (static linking via download-binaries).
[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "tls-rustls"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.52.1", features = ["macros", "rt"] }
