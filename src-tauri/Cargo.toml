[package]
name = "receiptier"
version = "0.1.0"
description = "Local-first invoice processing desktop app"
authors = ["Receiptier Contributors"]
edition = "2021"

[lib]
name = "receiptier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "receiptier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4"
hex = "0.4.3"
md-5 = "0.10.6"
mime_guess = "2.0.5"
reqwest = { version = "0.12.25", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rust_xlsxwriter = "0.81"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2.7.0"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.52.1", features = ["macros", "rt"] }
