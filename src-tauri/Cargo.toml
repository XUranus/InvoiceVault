[package]
name = "receiptier"
version = "0.1.0"
description = "Local-first invoice processing desktop app"
authors = ["Receiptier Contributors"]
edition = "2021"

[lib]
name = "receiptier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "receiptier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.0", features = [] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

