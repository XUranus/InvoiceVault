trigger:
  tags:
    include:
      - 'v*'

pr: none

variables:
  WINDOWS_DEPS_URL: 'https://github.com/XUranus/InvoiceVault/releases/download/build/invoicevault-dependencies-win-x86_64.zip'
  CARGO_HOME: '$(Pipeline.Workspace)/.cargo'
  RUSTUP_HOME: '$(Pipeline.Workspace)/.rustup'

stages:
  - stage: Build
    displayName: 'Build Windows Installers'
    jobs:
      - job: Windows
        displayName: 'Windows x86_64'
        pool:
          vmImage: 'windows-latest'

        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            displayName: 'Set up Node.js 22'
            inputs:
              versionSpec: '22.x'

          - script: |
              rustup default stable
              rustc --version
              cargo --version
            displayName: 'Set up Rust stable'

          - task: Cache@2
            displayName: 'Cache Cargo registry & build'
            inputs:
              key: 'cargo | "$(Agent.OS)" | src-tauri/Cargo.lock'
              restoreKeys: |
                cargo | "$(Agent.OS)"
              path: |
                $(CARGO_HOME)\registry
                $(CARGO_HOME)\git
                src-tauri\target
              cacheHitVar: CARGO_CACHE_HIT

          - script: npm ci
            displayName: 'Install frontend dependencies'

          - powershell: |
              $ErrorActionPreference = "Stop"
              $url = "$(WINDOWS_DEPS_URL)"
              New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
              Write-Host "Downloading Windows dependencies from $url"
              Invoke-WebRequest -Uri $url -OutFile "invoicevault-dependencies-win-x86_64.zip"
              Expand-Archive -Path "invoicevault-dependencies-win-x86_64.zip" -DestinationPath "src-tauri/resources" -Force
              Remove-Item "invoicevault-dependencies-win-x86_64.zip"
              Get-ChildItem -Recurse "src-tauri/resources/win-x86_64" | Select-Object FullName, Length
            displayName: 'Download bundled Windows dependencies'

          - script: npm run tauri -- build --bundles nsis msi
            displayName: 'Build Tauri NSIS & MSI installers'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish NSIS installer'
            inputs:
              targetPath: 'src-tauri/target/release/bundle/nsis'
              artifact: 'Windows-NSIS'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish MSI installer'
            inputs:
              targetPath: 'src-tauri/target/release/bundle/msi'
              artifact: 'Windows-MSI'
              publishLocation: 'pipeline'
